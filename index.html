<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticketera Interna | Carflex</title>
  <style>
    :root {
      --primary: #ff7225;
      --primary-dark: #e65a15;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg-soft: #f8fafc;
      --danger: #dc2626;
      --success: #15803d;
      --warning: #b45309;
      --info: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      position: relative;
      background: #f3f4f6;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url('fondo formulario.jpg') center/cover no-repeat;
      filter: brightness(.45) blur(4px);
      z-index: -2;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(17, 24, 39, 0.55), rgba(255, 114, 37, 0.18));
      z-index: -1;
    }

    .layout {
      width: 100%;
      max-width: 1180px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 24px;
      animation: fade .35s ease-out;
    }

    .panel,
    .card {
      background: rgba(255,255,255,.97);
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,.22);
      backdrop-filter: blur(12px);
    }

    .panel {
      padding: 34px;
    }

    .card {
      padding: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 16px;
      background: #fff;
      padding: 8px;
      border: 1px solid rgba(0,0,0,.05);
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 26px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .9px;
    }

    input, select, textarea {
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: .25s ease;
      background: #fff;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 114, 37, 0.10);
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .chip-option input {
      display: none;
    }

    .chip-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      text-align: center;
      border: 2px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      transition: .2s ease;
      padding: 10px 12px;
      background: #fff;
    }

    .chip-option label:hover {
      border-color: #d1d5db;
      background: #fafafa;
    }

    .chip-option input:checked + label {
      border-color: var(--primary);
      background: rgba(255,114,37,.09);
      color: var(--primary-dark);
    }

    .actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: .25s ease;
    }

    .btn-primary {
      flex: 1;
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #eef2f7;
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .status-box {
      margin-top: 14px;
      min-height: 24px;
      font-size: 14px;
    }

    .status-error,
    .status-ok {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
    }

    .status-error {
      background: #fef2f2;
      color: var(--danger);
      border-color: #fecaca;
    }

    .status-ok {
      background: #f0fdf4;
      color: var(--success);
      border-color: #bbf7d0;
    }

    .side-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .side-title {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .side-text {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .tag {
      background: rgba(255,114,37,.12);
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 12px;
      padding: 9px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .kpi {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .kpi .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .8px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .kpi .value {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .ticket-list {
      display: grid;
      gap: 12px;
    }

    .ticket-item {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      background: #fff;
    }

    .ticket-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .ticket-code {
      font-weight: 800;
      font-size: 15px;
    }

    .badge {
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.pending { background: #fff7ed; color: var(--warning); }
    .badge.progress { background: #eff6ff; color: var(--info); }
    .badge.done { background: #f0fdf4; color: var(--success); }

    .ticket-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .ticket-desc {
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .search-box {
      margin-bottom: 14px;
    }

    .help-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,114,37,.08), rgba(255,255,255,.9));
      border: 1px solid rgba(255,114,
