<main class="main-card">
    <form id="ticketForm">
      <div class="form-grid">
        <div class="field">
          <label><span class="icon">✉</span> Correo <span class="req">*</span></label>
          <input type="email" name="correo" placeholder="nombre@carflex.cl" required>
        </div>

        <div class="field">
          <label><span class="icon">👤</span> Cliente <span class="req">*</span></label>
          <input type="text" name="cliente" placeholder="Busca o escribe cliente" required>
        </div>

        <div class="field">
          <label><span class="icon">📄</span> Patente <span class="req">*</span></label>
          <input type="text" id="patente" name="patente" placeholder="Ej: DBS321" maxlength="6" required>
        </div>

        <div class="field">
          <label><span class="icon">♡</span> Tipo <span class="req">*</span></label>
          <div class="chips-group">
            <label class="chip-item"><input type="radio" name="tipo" value="Agendamiento" checked><span>Agendamiento</span></label>
            <label class="chip-item"><input type="radio" name="tipo" value="Documentación"><span>Documentación</span></label>
            <label class="chip-item"><input type="radio" name="tipo" value="Mecánica"><span>Mecánica</span></label>
            <label class="chip-item"><input type="radio" name="tipo" value="DyP"><span>DyP</span></label>
            <label class="chip-item"><input type="radio" name="tipo" value="Otros"><span>Otros</span></label>
          </div>
        </div>

        <div class="field full">
          <label><span class="icon">📝</span> Detalle <span class="req">*</span></label>
          <textarea name="detalle" placeholder="Describe el requerimiento, contexto y prioridad" rows="4" required></textarea>
        </div>

        <div class="field full">
          <label><span class="icon">📎</span> Adjuntos</label>
          <div class="dropzone">
            <div class="dropzone-content">
              <label for="file-upload" class="btn-file">Elegir archivos</label>
              <span id="file-name" style="font-size: 12px; color: var(--text-muted)">No se ha seleccionado ningún archivo</span>
            </div>
            <p style="margin-top: 8px; font-size: 11px; color: var(--text-muted); text-align: center;">Adjunta archivos - PDF, JPG, PNG (Máx 10MB)</p>
            <input type="file" id="file-upload" hidden multiple onchange="document.getElementById('file-name').innerText = this.files.length + ' archivos seleccionados'">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="reset" class="btn-clear">Limpiar datos</button>
        <button type="submit" class="btn-submit" id="submitBtn">Crear Ticket</button>
      </div>
    </form>
</main>

<script>
  // Formateo de patente (Tu código original corregido)
  document.getElementById("patente").addEventListener("input", e => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  });

  // LÓGICA DE ENVÍO A N8N
  const ticketForm = document.getElementById('ticketForm');
  const WEBHOOK_URL = 'https://uncollapsible-melodiously-chung.ngrok-free.dev/webhook/tickets';

  ticketForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    btn.innerText = 'Enviando...';
    btn.disabled = true;

    // Recolectar datos del formulario
    const formData = new FormData(ticketForm);
    const data = Object.fromEntries(formData.entries());

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      });

      if (response.ok) {
        alert('✅ Ticket creado con éxito en n8n');
        ticketForm.reset();
        document.getElementById('file-name').innerText = "No se ha seleccionado ningún archivo";
      } else {
        throw new Error('Error en la respuesta del servidor');
      }
    } catch (error) {
      console.error('Error:', error);
      alert('❌ Error al enviar el ticket. Revisa que ngrok esté activo.');
    } finally {
      btn.innerText = 'Crear Ticket';
      btn.disabled = false;
    }
  });
</script>
