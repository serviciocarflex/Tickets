<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ticketera Operaciones | Carflex</title>

  <style>
    :root {
      --primary: #6d28d9;
      --primary-soft: rgba(109, 40, 217, 0.08);
      --dark: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --bg: #f4f6fb;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--dark);
    }

    .container {
      width: min(1200px, 95%);
      margin: 30px auto;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .header img {
      width: 60px;
      background: #fff;
      border-radius: 12px;
      padding: 8px;
      border: 1px solid var(--line);
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 2px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    /* LAYOUT */
    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
    }

    /* FORM */
    form {
      display: grid;
      gap: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    .required::after {
      content: " *";
      color: red;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    textarea {
      min-height: 120px;
    }

    /* CHIPS */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip input {
      display: none;
    }

    .chip span {
      border: 1px solid var(--line);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
    }

    .chip input:checked + span {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    /* FILE */
    .dropzone {
      border: 1px dashed var(--line);
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    /* BUTTONS */
    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary {
      background: #f1f5f9;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    /* ASIDE */
    .aside h3 {
      margin-top: 0;
    }

    .step {
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .step strong {
      color: var(--dark);
    }

    @media(max-width: 900px){
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <img src="Logo carflex.jpg">
    <div>
      <h1>Ticketera de Operaciones</h1>
      <p>Ingreso de requerimientos comerciales hacia operaciones</p>
    </div>
  </div>

  <div class="layout">

    <!-- FORMULARIO -->
    <div class="card">
      <h2>Crear ticket</h2>

      <form id="ticketForm">

        <div class="grid-2">
          <div>
            <label class="required">Correo</label>
            <input type="email" required placeholder="nombre@carflex.cl">
          </div>

          <div>
            <label class="required">Cliente</label>
            <input type="text" required placeholder="Cliente">
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label class="required">Patente</label>
            <input type="text" required placeholder="DBS321">
          </div>

          <div>
            <label class="required">Tipo</label>
            <div class="chips">
              <label class="chip"><input type="radio" name="tipo" required><span>Agendamiento</span></label>
              <label class="chip"><input type="radio" name="tipo"><span>Documentación</span></label>
              <label class="chip"><input type="radio" name="tipo"><span>Mecánica</span></label>
              <label class="chip"><input type="radio" name="tipo"><span>DyP</span></label>
              <label class="chip"><input type="radio" name="tipo"><span>Otros</span></label>
            </div>
          </div>
        </div>

        <div>
          <label class="required">Detalle</label>
          <textarea required placeholder="Describe el requerimiento"></textarea>
        </div>

        <div>
          <label>Adjuntos</label>
          <div class="dropzone">
            Adjunta archivos (PDF, imágenes, etc.)
            <input type="file" multiple>
          </div>
        </div>

        <div class="actions">
          <button type="reset" class="secondary">Limpiar</button>
          <button type="submit" class="primary">Enviar ticket</button>
        </div>

      </form>
    </div>

    <!-- ASIDE -->
    <div class="card aside">
      <h3>Flujo</h3>

      <div class="step"><strong>1.</strong> Comercial ingresa ticket</div>
      <div class="step"><strong>2.</strong> Se registra automáticamente</div>
      <div class="step"><strong>3.</strong> Operaciones gestiona</div>

      <hr>

      <p style="font-size:13px; color:#64748b;">
        Mientras más claro el detalle, más rápida la gestión.
      </p>
    </div>

  </div>

</div>

<script>
document.getElementById('ticketForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert('Aquí conectarás con n8n 🚀');
});
</script>

</body>
</html>
