<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear ticket de gestión operativa | Carflex</title>
  <style>
    :root {
      --primary: #334155;
      --primary-hover: #1e293b;
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius-lg: 12px;
      --radius-sm: 8px;
      --accent: #2563eb; 
      --accent-hover: #1d4ed8;
      --focus-ring: rgba(139, 92, 246, 0.2);
      --purple-focus: #8b5cf6;
      --soft-blue-bg: #eff6ff;
      --soft-blue-text: #3b82f6;
    }

    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      margin: 0;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1150px;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 25px;
    }

    .header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: var(--bg-card);
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .brand-container {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .brand-container img { height: 25px; width: auto; }

    .header-text h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--primary); }
    .header-text p { margin: 4px 0 0; color: var(--text-muted); font-size: 14px; }

    .main-card {
      background: var(--bg-card);
      padding: 30px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .field.full { grid-column: 1 / -1; }

    .field label {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Estilo para los nuevos iconos SVG */
    .icon-svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      background: #fff;
      transition: 0.1s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .chips-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip-item { cursor: pointer; }
    .chip-item input { display: none; }
    .chip-item span {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      transition: 0.1s;
      font-weight: 500;
      color: var(--text-main);
    }

    .chip-item input:checked + span {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .dropzone {
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 20px;
      text-align: center;
      background: #f8fafc;
      transition: 0.2s;
    }

    .btn-file {
      background: #fff;
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      display: inline-block;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end; 
      gap: 12px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .btn-submit {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-clear {
      background: #e2e8f0;
      color: #475569;
      border: none;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    .info-card {
      background: var(--bg-card);
      padding: 25px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .info-card h3 { margin: 0 0 10px; font-size: 17px; color: var(--primary); }
    .step { display: flex; gap: 12px; margin-bottom: 18px; }
    .step-num {
      width: 24px; height: 24px;
      background: var(--soft-blue-bg);
      color: var(--soft-blue-text);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 11px; flex-shrink: 0;
    }
    
    .step-text h4 { margin: 0; font-size: 13px; font-weight: 600; }
    .step-text p { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); }

    @media (max-width: 860px) {
      .container { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; gap: 15px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="brand-container">
      <img src="Logo carflex.jpg" alt="Carflex">
      <div class="header-text">
        <h1>Crear ticket de gestión operativa</h1>
        <p>Registra requerimientos para el equipo de operaciones</p>
      </div>
    </div>
    <div style="background: #f8fafc; color: #64748b; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid var(--border);">MESA INTERNA</div>
  </header>

  <main class="main-card">
    <form id="ticketForm">
      <div class="form-grid">
        
        <div class="field">
          <label>
            <svg class="icon-svg"><use href="#icon-mail"></use></svg>
            Correo <span style="color:#dc2626">*</span>
          </label>
          <input type="email" name="correo" placeholder="nombre@carflex.cl" required>
        </div>

        <div class="field">
          <label>
            <svg class="icon-svg"><use href="#icon-user"></use></svg>
            Cliente <span style="color:#dc2626">*</span>
          </label>
          <input type="text" name="cliente" placeholder="Nombre de la empresa o cliente" required>
        </div>

        <div class="field">
          <label>
            <svg class="icon-svg"><use href="#icon-car"></use></svg>
            Patente <span style="color:#dc2626">*</span>
          </label>
          <input type="text" id="patente" name="patente" placeholder="ABCD12" maxlength="6" pattern="[A-Z]{4}[0-9]{2}" title="4 letras y 2 números" required>
        </div>

        <div class="field">
          <label>
            <svg class="icon-svg"><use href="#icon-tag"></use></svg>
            Tipo <span style="color:#dc2626">*</span>
          </label>
          <div class="chips-group">
            <label class="chip-item"><input type="radio" name="tipo" value="Agendamiento" checked><span>Agendamiento</span></label>
            <label class="chip-item"><input type="radio" name="tipo" value="Documentación"><span>Documentación</span></label>
            <label class="chip-item"><input type="radio" name="tipo" value="Mecánica"><span>Mecánica</span></label>
            <label class="chip-item"><input type="radio" name="tipo" value="DyP"><span>DyP</span></label>
            <label class="chip-item"><input type="radio" name="tipo" value="Cobranza"><span>Cobranza</span></label>
            <label class="chip-item"><input type="radio" name="tipo" value="Otros"><span>Otros</span></label>
          </div>
        </div>

        <div class="field full">
          <label>
            <svg class="icon-svg"><use href="#icon-edit"></use></svg>
            Detalle <span style="color:#dc2626">*</span>
          </label>
          <textarea name="detalle" placeholder="Describe el requerimiento con detalle..." rows="4" required></textarea>
        </div>

        <div class="field full">
          <label>
            <svg class="icon-svg"><use href="#icon-paperclip"></use></svg>
            Adjuntos
          </label>
          <div class="dropzone">
            <label for="file-upload" class="btn-file">Elegir archivos</label>
            <p id="file-name" style="font-size: 12px; color: var(--text-muted); margin: 10px 0 0;">PDF, JPG, PNG (Máx 10MB)</p>
            <input type="file" id="file-upload" hidden multiple onchange="document.getElementById('file-name').innerText = this.files.length + ' archivos seleccionados'">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="reset" class="btn-clear">Limpiar</button>
        <button type="submit" class="btn-submit" id="submitBtn">Crear Ticket</button>
      </div>
    </form>
  </main>

  <aside class="sidebar">
    <div class="info-card">
      <h3>Pasos a seguir</h3>
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text"><h4>Registro</h4><p>Ingresa los datos solicitados.</p></div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text"><h4>Validación</h4><p>El sistema verifica la información.</p></div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text"><h4>Gestión</h4><p>Operaciones recibe y procesa.</p></div>
      </div>
    </div>
  </aside>
</div>

<svg style="display: none;">
  <symbol id="icon-mail" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="m22 6-10 7L2 6"/></symbol>
  <symbol id="icon-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="icon-car" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></symbol>
  <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></symbol>
  <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
  <symbol id="icon-paperclip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
</svg>

<script>
  // Formateo estricto: 4 letras + 2 números
  document.getElementById("patente").addEventListener("input", e => {
    let val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    let letters = val.slice(0, 4).replace(/[^A-Z]/g, "");
    let numbers = val.slice(4, 6).replace(/[^0-9]/g, "");
    e.target.value = (letters + numbers).slice(0, 6);
  });

  const ticketForm = document.getElementById('ticketForm');
  const WEBHOOK_URL = 'https://uncollapsible-melodiously-chung.ngrok-free.dev/webhook-test/tickets';

  ticketForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const patenteInput = document.getElementById('patente');
    if (!/^[A-Z]{4}[0-9]{2}$/.test(patenteInput.value)) {
      alert("La patente debe ser 4 letras y 2 números (Ej: ABCD12)");
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.innerText = 'Enviando...';
    btn.disabled = true;

    const formData = new FormData();
    formData.append('correo', ticketForm.correo.value);
    formData.append('cliente', ticketForm.cliente.value);
    formData.append('patente', patenteInput.value);
    formData.append('tipo', ticketForm.querySelector('input[name="tipo"]:checked').value);
    formData.append('detalle', ticketForm.detalle.value);

    const fileInput = document.getElementById('file-upload');
    for (let i = 0; i < fileInput.files.length; i++) {
      formData.append(`adjuntos_${i}`, fileInput.files[i]);
    }

    try {
      const response = await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
      if (response.ok) {
        alert('Ticket creado con éxito');
        ticketForm.reset();
        document.getElementById('file-name').innerText = "PDF, JPG, PNG (Máx 10MB)";
      } else { alert('Error en el servidor'); }
    } catch (error) { alert('Error de conexión'); }
    finally { btn.innerText = 'Crear Ticket'; btn.disabled = false; }
  });
</script>

</body>
</html>
